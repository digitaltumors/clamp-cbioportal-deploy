name: ${COMPOSE_PROJECT_NAME:-clamp-cbioportal}

services:
  cbioportal-database:
    image: ${CLAMP_MYSQL_IMAGE:-clamp-mysql:local}
    build:
      context: ./database/mysql
      dockerfile: Dockerfile
      args:
        MYSQL_BASE: mysql:${MYSQL_VERSION:-8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
        GOSU_BUILDER: golang:${GOSU_BUILDER_VERSION:-1.27.1-alpine3.24@sha256:cf6fca6641884b8433441b2b0652976f975e1d0fdd26d177eaaf8596087f3125}
        IMAGE_REVISION: ${IMAGE_REVISION:-local}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_MYSQL_DB_NAME:?Set DB_MYSQL_DB_NAME in .env}
      MYSQL_USER: ${DB_MYSQL_USERNAME:?Set DB_MYSQL_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD:?Set DB_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD:?Set DB_MYSQL_ROOT_PASSWORD in .env}
    command: ["--local-infile=1"]
    volumes:
      - ./database/init/cgds.sql:/docker-entrypoint-initdb.d/01-cgds.sql:ro,z
      - ./database/init/seed.sql.gz:/docker-entrypoint-initdb.d/02-seed.sql.gz:ro,z
      - cbioportal_mysql_data:/var/lib/mysql
    networks: [portal-database]
    security_opt: [no-new-privileges:true]
    pids_limit: ${MYSQL_PIDS_LIMIT:-512}
    mem_limit: ${MYSQL_MEMORY_LIMIT:-4g}
    cpus: ${MYSQL_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  cbioportal-session-database:
    image: mongo:${MONGO_VERSION:-7.0.41@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0}
    restart: unless-stopped
    profiles: [session]
    environment:
      MONGO_INITDB_DATABASE: session-service
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - ./database/mongo/init-session-user.sh:/docker-entrypoint-initdb.d/10-session-user.sh:ro,z
      - cbioportal_mongo_data:/data/db
    networks: [session-database]
    security_opt: [no-new-privileges:true]
    pids_limit: ${MONGO_PIDS_LIMIT:-512}
    mem_limit: ${MONGO_MEMORY_LIMIT:-2g}
    cpus: ${MONGO_CPU_LIMIT:-1.5}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  cbioportal-session:
    image: ${CLAMP_SESSION_SERVICE_IMAGE:-clamp-session-service:local}
    build:
      context: ./session-service
      dockerfile: Dockerfile
      args:
        SESSION_SERVICE_BASE: cbioportal/session-service:${SESSION_SERVICE_VERSION:-0.6.5@sha256:5be37b996297dc9ca2503988407e79377c09acec74d06c9b15a9ff5e95f966d3}
        JAVA_RUNTIME_BASE: eclipse-temurin:${SESSION_JAVA_RUNTIME_VERSION:-21-jre-alpine@sha256:974b08960c5d96694c780e65b2d5705268ab1e1ca1a0dd0caf4ba6c3fe34d699}
        IMAGE_REVISION: ${IMAGE_REVISION:-local}
    restart: unless-stopped
    profiles: [session]
    user: "${SESSION_SERVICE_UID:-10001}:${SESSION_SERVICE_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${SESSION_PIDS_LIMIT:-256}
    mem_limit: ${SESSION_MEMORY_LIMIT:-1g}
    cpus: ${SESSION_CPU_LIMIT:-1.0}
    environment:
      SERVER_PORT: 5001
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx${SESSION_JAVA_HEAP:-512m}
        -Dspring.data.mongodb.uri=mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@cbioportal-session-database:27017/session-service?authSource=session-service
    depends_on:
      cbioportal-session-database:
        condition: service_started
    networks: [session-api, session-database]

  cbioportal:
    image: ${CLAMP_CBIOPORTAL_IMAGE:-clamp-cbioportal:local}
    build:
      context: ./cbioportal
      dockerfile: Dockerfile
      args:
        CBIOPORTAL_BASE: cbioportal/cbioportal:${CBIOPORTAL_VERSION:-6.4.5@sha256:96809f5607be1fa02177faae2219d8cd61bb23c6ef79b8e05ba286606ae94b6c}
        IMAGE_REVISION: ${IMAGE_REVISION:-local}
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${CBIOPORTAL_PIDS_LIMIT:-512}
    mem_limit: ${CBIOPORTAL_MEMORY_LIMIT:-6g}
    cpus: ${CBIOPORTAL_CPU_LIMIT:-3.0}
    environment:
      DB_MYSQL_DB_NAME: ${DB_MYSQL_DB_NAME:?Set DB_MYSQL_DB_NAME in .env}
      DB_MYSQL_USERNAME: ${DB_MYSQL_USERNAME:?Set DB_MYSQL_USERNAME in .env}
      DB_MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD:?Set DB_MYSQL_PASSWORD in .env}
      DB_MYSQL_URL: ${DB_MYSQL_URL:?Set DB_MYSQL_URL in .env}
      PORTAL_HOME: /cbioportal-webapp
      JAVA_OPTS: ${CBIOPORTAL_JAVA_OPTS:--Xms1g -Xmx4g}
      WEBAPP_OPTS: --spring.config.location=file:/cbioportal-webapp/application.properties
    command:
      - sh
      - -c
      - >-
        java $${JAVA_OPTS} -cp '/cbioportal-webapp:/cbioportal-webapp/lib/*'
        org.cbioportal.PortalApplication $${WEBAPP_OPTS}
    volumes:
      - ./runtime/application.properties:/cbioportal-webapp/application.properties:ro,z
    depends_on:
      cbioportal-database:
        condition: service_started
    expose: ["8080"]
    networks: [portal-web, portal-database, session-api]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/cbioportal/api/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  web:
    image: ${CLAMP_WEB_IMAGE:-clamp-web:local}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NGINX_BASE: nginx:${NGINX_VERSION:-1.31.5-alpine-slim@sha256:3b171d7224b669faa3cc2137fea0a65301791df1ec1f271ebd2a2b7461f7fade}
        IMAGE_REVISION: ${IMAGE_REVISION:-local}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${WEB_PIDS_LIMIT:-128}
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-1.0}
    depends_on:
      cbioportal:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-45000}:8080"
    networks: [portal-web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  study-loader:
    image: ${CLAMP_STUDY_LOADER_IMAGE:-clamp-study-loader:local}
    build:
      context: .
      dockerfile: study-loader/Dockerfile
      args:
        CBIOPORTAL_BASE: cbioportal/cbioportal:${CBIOPORTAL_VERSION:-6.4.5@sha256:96809f5607be1fa02177faae2219d8cd61bb23c6ef79b8e05ba286606ae94b6c}
        IMAGE_REVISION: ${IMAGE_REVISION:-local}
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${IMPORT_PIDS_LIMIT:-512}
    mem_limit: ${IMPORT_MEMORY_LIMIT:-10g}
    cpus: ${IMPORT_CPU_LIMIT:-4.0}
    working_dir: /tmp
    environment:
      DB_MYSQL_DB_NAME: ${DB_MYSQL_DB_NAME:?Set DB_MYSQL_DB_NAME in .env}
      DB_MYSQL_USERNAME: ${DB_MYSQL_USERNAME:?Set DB_MYSQL_USERNAME in .env}
      DB_MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD:?Set DB_MYSQL_PASSWORD in .env}
      DB_MYSQL_URL: ${DB_MYSQL_URL:?Set DB_MYSQL_URL in .env}
      IMPORT_JAVA_OPTS: ${IMPORT_JAVA_OPTS:--Xms1g -Xmx8g}
      AUTH_MODE: ${AUTH_MODE:-false}
      PORTAL_HOME: /cbioportal-webapp
      PORTAL_URL: http://cbioportal:8080/cbioportal
      REPORTS_DIR: /reports
    depends_on:
      cbioportal:
        condition: service_started
    volumes:
      - ${STUDY_DATA_PATH:-./studies/clamp_2026}:/study/clamp_2026:ro,z
      - ./reports:/reports:z
      - ./runtime/application.properties:/cbioportal-webapp/application.properties:ro,z
    networks: [portal-database, session-api]
    restart: "no"

networks:
  portal-web:
  portal-database:
    internal: true
  session-api:
    internal: true
  session-database:
    internal: true

volumes:
  cbioportal_mysql_data:
  cbioportal_mongo_data:
