services:
  cbioportal:
    volumes:
      - ./secrets/saml/idp-metadata.xml:/cbioportal-webapp/idp-metadata.xml:ro
      - ./secrets/saml/local.crt:/cbioportal-webapp/local.crt:ro
      - ./secrets/saml/local.key:/cbioportal-webapp/local.key:ro
    depends_on:
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.2.4}
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:${KEYCLOAK_PORT:-8081}
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run configure-auth.sh --local}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./runtime/keycloak-realm.json:/opt/keycloak/data/import/clamp-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    networks: [clamp]

volumes:
  keycloak_data:
