name: build-and-security-test-images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Configure CI environment
        run: ./scripts/configure.sh --generate-secrets
      - name: Check shell scripts
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # reviewed master, 2026-09-11
        env:
          SHELLCHECK_OPTS: -x -P SCRIPTDIR
        with:
          scandir: .
          check_together: 'yes'
      - name: Validate all Compose profiles
        run: docker compose --env-file .env -f compose.yaml --profile '*' config --quiet
      - name: Assert effective security configuration
        run: ./scripts/test-security-config.sh
      - name: Build images
        run: ./scripts/build.sh
      - name: Generate SBOMs and scan all deployable images
        run: ./scripts/scan-images.sh
      - name: Retain security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-security-reports
          path: reports/security/
          # This step runs even when checkout, configuration, or image building
          # fails before the scanner can create its output. Do not replace the
          # original failure with a secondary missing-artifact error.
          if-no-files-found: warn
