worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The host port is loopback-only by default. These values are honored for
    # deployments that explicitly enable a trusted local TLS reverse proxy.
    map $http_x_forwarded_proto $external_scheme {
        default $scheme;
        https https;
    }
    map $http_host $external_http_port {
        ~:(?<external_host_port>[0-9]+)$ $external_host_port;
        default 80;
    }

    map $external_scheme $external_port {
        default $external_http_port;
        https 443;
    }
    map $external_scheme $strict_transport_security {
        default "";
        https "max-age=31536000; includeSubDomains";
    }

    upstream cbioportal_backend {
        server cbioportal:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "$strict_transport_security" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; form-action 'self'" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = / {
            return 302 /test/;
        }

        location /test/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /test/index.html;
        }

        location /cbioportal/ {
            proxy_pass http://cbioportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $external_port;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            include /etc/nginx/portal-security-headers.conf;
        }

        location /api/ {
            proxy_pass http://cbioportal_backend/cbioportal/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $external_port;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            include /etc/nginx/portal-security-headers.conf;
        }

        location = /webservice.do {
            proxy_pass http://cbioportal_backend/cbioportal/webservice.do;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $external_port;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            include /etc/nginx/portal-security-headers.conf;
        }

        location ~ ^/(js|css|static|reactapp|images)/ {
            rewrite ^/(.*)$ /cbioportal/$1 break;
            proxy_pass http://cbioportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $external_port;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            include /etc/nginx/portal-security-headers.conf;
        }
    }
}
