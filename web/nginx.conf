worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream cbioportal_backend {
        server cbioportal:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = / {
            return 302 /test/;
        }

        location /test/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /test/index.html;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }

        location /cbioportal/ {
            proxy_pass http://cbioportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /api/ {
            proxy_pass http://cbioportal_backend/cbioportal/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
        }

        location = /webservice.do {
            proxy_pass http://cbioportal_backend/cbioportal/webservice.do;
            proxy_set_header Host $http_host;
            proxy_hide_header X-Frame-Options;
        }

        location ~ ^/(js|css|static|reactapp|images)/ {
            rewrite ^/(.*)$ /cbioportal/$1 break;
            proxy_pass http://cbioportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
        }
    }
}
