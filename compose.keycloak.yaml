services:
  cbioportal:
    depends_on:
      keycloak:
        condition: service_started

  keycloak:
    image: ${CLAMP_KEYCLOAK_IMAGE:-clamp-keycloak:local}
    build:
      context: ./auth/keycloak
      dockerfile: Dockerfile
      args:
        KEYCLOAK_BASE: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c}
        MAVEN_BUILDER: docker.io/library/maven:${MAVEN_BUILDER_VERSION:-3-eclipse-temurin-21@sha256:c2a2c58516d160f43b50f12baa427ca86989e0bc942609e04aff61da5d9a7d74}
        IMAGE_REVISION: ${IMAGE_REVISION:-local}
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:${KEYCLOAK_PORT:-46000}
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run configure-auth.sh --local}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-46000}:8080"
    volumes:
      - ./runtime/keycloak-realm.json:/opt/keycloak/data/import/clamp-realm.json:ro,z
      - keycloak_data:/opt/keycloak/data
    networks: [identity]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-512}
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-2g}
    cpus: ${KEYCLOAK_CPU_LIMIT:-2.0}

networks:
  identity:

volumes:
  keycloak_data:
