services:
  cbioportal:
    depends_on:
      keycloak:
        condition: service_started

  keycloak:
    image: ${CLAMP_KEYCLOAK_IMAGE:-clamp-keycloak:local}
    build:
      context: ./auth/keycloak
      dockerfile: Dockerfile
      args:
        KEYCLOAK_BASE: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54}
        IMAGE_REVISION: ${IMAGE_REVISION:-local}
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:${KEYCLOAK_PORT:-8081}
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run configure-auth.sh --local}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./runtime/keycloak-realm.json:/opt/keycloak/data/import/clamp-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    networks: [identity]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-512}
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-2g}
    cpus: ${KEYCLOAK_CPU_LIMIT:-2.0}

networks:
  identity:

volumes:
  keycloak_data:
